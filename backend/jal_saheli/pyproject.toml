[tool.pytest.ini_options]
# Run from: backend/jal_saheli/
# Command:  pytest

asyncio_mode = "auto"
testpaths = ["tests"]
env_files = [".env.test"]

# Show short test summary
addopts = "-v --tb=short -p no:warnings"

# Coverage (optional — run with: pytest --cov=app --cov-report=term-missing)
# addopts = "-v --tb=short --cov=app --cov-report=term-missing"


[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN"]   # No type annotations required in tests
